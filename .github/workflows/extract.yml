name: Extract update zip

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract semua zip di root repo
        run: |
          shopt -s nullglob
          files=(*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Tidak ada file zip di root."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Ekstrak $f"
            unzip -o "$f" -d .
            rm "$f"
          done

      - name: Commit hasil ekstrak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Tidak ada perubahan." && exit 0
          git commit -m "Apply update dari zip"
          git push
